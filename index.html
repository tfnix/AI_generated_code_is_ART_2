<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Amiga Boing Ball Tribute</title>
    <!-- Tailwind CSS for modern typography / styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050510;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none">

    <canvas id="boingCanvas"></canvas>

    <script>
        window.onload = function () {
            const canvas = document.getElementById('boingCanvas');
            const ctx = canvas.getContext('2d');

            let width, height;
            let stars = [];
            let starCount = 600;

            // Boing ball rotational state
            let rotX = 0;
            let rotY = 0;
            let rotZ = 0;

            // Physics state variables for natural bouncing
            let ballY = 0;
            let ballVelocityY = 0;
            const gravity = 0.40;
            const bounceDamping = 0.84; 
            let squashFactor = 0;

            // Sphere geometry parameters
            const latitudes = 12;
            const longitudes = 16;
            const radius = 120;

            class Star {
                constructor() {
                    this.reset(true);
                }

                reset(initial = false) {
                    this.x = (Math.random() - 0.5) * width * 2;
                    this.y = (Math.random() - 0.5) * height * 2;
                    this.z = initial ? Math.random() * width : width;
                    const colors = ['#ffffff', '#ff9999', '#99ccff', '#ffff99'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.size = Math.random() * 1.5 + 0.5;
                }

                update() {
                    this.z -= 1.5;
                    if (this.z <= 0) {
                        this.reset();
                        this.z = width;
                    }
                }

                draw() {
                    const k = 250 / this.z;
                    const px = this.x * k + width / 2;
                    const py = this.y * k + height / 2;

                    if (px >= 0 && px <= width && py >= 0 && py <= height) {
                        const pSize = Math.max(0, (1 - this.z / width) * this.size * k * 1.5);
                        ctx.save();
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(px, py, pSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            }

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            function initStars() {
                stars = [];
                for (let i = 0; i < starCount; i++) {
                    stars.push(new Star());
                }
                // Start ball near the upper area
                ballY = -height * 0.2;
            }

            window.addEventListener('resize', resizeCanvas);

            function drawRetroGrid(timestamp) {
                const horizonY = height * 0.55;
                const gridScroll = (timestamp * 0.08) % 40;

                ctx.save();
                // Sky background gradient up to horizon
                const grad = ctx.createLinearGradient(0, 0, 0, horizonY);
                grad.addColorStop(0, '#050510');
                grad.addColorStop(1, '#1e1b4b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, horizonY);

                // Solid dark background for floor area
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, horizonY, width, height - horizonY);

                // Neon wireframe grid perspective lines
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
                ctx.shadowBlur = 4;

                // Converging vertical lines toward vanishing point
                const vanishingX = width / 2;
                for (let x = -width * 1.5; x <= width * 2.5; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(vanishingX, horizonY);
                    ctx.lineTo(x + (vanishingX - x) * 0.2, height);
                    ctx.stroke();
                }

                // Horizontal receding grid lines
                for (let y = horizonY; y < height; y += (y - horizonY) * 0.12 + 2) {
                    const shiftedY = y + (gridScroll * 0.2);
                    if (shiftedY >= horizonY && shiftedY <= height) {
                        ctx.beginPath();
                        ctx.moveTo(0, shiftedY);
                        ctx.lineTo(width, shiftedY);
                        ctx.stroke();
                    }
                }

                ctx.restore();
            }

            function getSphereVertex(theta, phi, r, sx, sy) {
                const x = r * Math.sin(theta) * Math.cos(phi) * sx;
                const y = r * Math.cos(theta) * sy;
                const z = r * Math.sin(theta) * Math.sin(phi);
                return { x, y, z };
            }

            function rotatePoint(p, rx, ry, rz) {
                // Rotate around X
                let cos = Math.cos(rx), sin = Math.sin(rx);
                let y1 = p.y * cos - p.z * sin;
                let z1 = p.y * sin + p.z * cos;
                let x1 = p.x;

                // Rotate around Y
                cos = Math.cos(ry); sin = Math.sin(ry);
                let x2 = x1 * cos + z1 * sin;
                let z2 = -x1 * sin + z1 * cos;
                let y2 = y1;

                // Rotate around Z
                cos = Math.cos(rz); sin = Math.sin(rz);
                let x3 = x2 * cos - y2 * sin;
                let y3 = x2 * sin + y2 * cos;
                let z3 = z2;

                return { x: x3, y: y3, z: z3 };
            }

            function drawBoingBall(timestamp) {
                // Smooth rotation update
                rotY += 0.025;
                rotX += 0.015;
                rotZ = Math.sin(timestamp * 0.002) * 0.15;

                // Physics simulation
                ballVelocityY += gravity;
                ballY += ballVelocityY;

                // Ground plane precisely aligned with the floor horizon setup
                const horizonY = height * 0.55;
                const groundY = horizonY + 20;
                const maxBallCenterY = groundY - radius;

                if (ballY >= maxBallCenterY) {
                    ballY = maxBallCenterY;
                    
                    // Subtle squash intensity based on impact speed
                    const impactSpeed = Math.abs(ballVelocityY);
                    squashFactor = Math.min(0.12, impactSpeed * 0.015);

                    // Reverse and damp velocity
                    ballVelocityY = -ballVelocityY * bounceDamping;

                    // Keep bounce alive if velocity drops too low
                    if (Math.abs(ballVelocityY) < 1.2) {
                        ballVelocityY = -12.5;
                    }
                } else {
                    // Smoothly recover from squash when airborne
                    squashFactor *= 0.85;
                }

                const currentSquashX = 1 + squashFactor;
                const currentSquashY = 1 - squashFactor;

                const cx = width / 2;
                const cy = ballY;

                // 1. Draw projected shadow on the floor
                ctx.save();
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.lineWidth = 1.5;
                const distanceToGround = groundY - ballY;
                const shadowScale = Math.max(0.3, 1 - (distanceToGround / (height * 0.5)));
                const shadowRadiusX = radius * 1.1 * shadowScale;
                const shadowRadiusY = radius * 0.2 * shadowScale;
                
                ctx.beginPath();
                ctx.ellipse(cx, groundY + 10, shadowRadiusX, shadowRadiusY, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // 2. Generate and sort wireframe quads (Painter's algorithm)
                const quads = [];

                for (let lat = 0; lat < latitudes; lat++) {
                    const theta1 = (lat / latitudes) * Math.PI;
                    const theta2 = ((lat + 1) / latitudes) * Math.PI;

                    for (let lon = 0; lon < longitudes; lon++) {
                        const phi1 = (lon / longitudes) * Math.PI * 2;
                        const phi2 = ((lon + 1) / longitudes) * Math.PI * 2;

                        const p1 = getSphereVertex(theta1, phi1, radius, currentSquashX, currentSquashY);
                        const p2 = getSphereVertex(theta2, phi1, radius, currentSquashX, currentSquashY);
                        const p3 = getSphereVertex(theta2, phi2, radius, currentSquashX, currentSquashY);
                        const p4 = getSphereVertex(theta1, phi2, radius, currentSquashX, currentSquashY);

                        const rp1 = rotatePoint(p1, rotX, rotY, rotZ);
                        const rp2 = rotatePoint(p2, rotX, rotY, rotZ);
                        const rp3 = rotatePoint(p3, rotX, rotY, rotZ);
                        const rp4 = rotatePoint(p4, rotX, rotY, rotZ);

                        const avgZ = (rp1.z + rp2.z + rp3.z + rp4.z) / 4;
                        const isRed = (lat + lon) % 2 === 0;

                        quads.push({
                            points: [rp1, rp2, rp3, rp4],
                            avgZ: avgZ,
                            strokeColor: isRed ? '#ff3366' : '#00ffff',
                            glowColor: isRed ? 'rgba(255, 51, 102, 0.35)' : 'rgba(0, 255, 255, 0.35)'
                        });
                    }
                }

                quads.sort((a, b) => a.avgZ - b.avgZ);

                // Render quads
                quads.forEach(quad => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(cx + quad.points[0].x, cy + quad.points[0].y);
                    for (let i = 1; i < quad.points.length; i++) {
                        ctx.lineTo(cx + quad.points[i].x, cy + quad.points[i].y);
                    }
                    ctx.closePath();

                    ctx.fillStyle = quad.glowColor;
                    ctx.fill();

                    ctx.strokeStyle = quad.strokeColor;
                    ctx.lineWidth = 1.5;
                    ctx.shadowColor = quad.strokeColor;
                    ctx.shadowBlur = 8;
                    ctx.stroke();
                    ctx.restore();
                });
            }

            function animate(timestamp) {
                ctx.clearRect(0, 0, width, height);

                // Render background stars
                for (let i = 0; i < stars.length; i++) {
                    stars[i].update();
                    stars[i].draw();
                }

                // Render floor and grid
                drawRetroGrid(timestamp);

                // Render bouncing ball
                drawBoingBall(timestamp);

                requestAnimationFrame(animate);
            }

            resizeCanvas();
            initStars();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
